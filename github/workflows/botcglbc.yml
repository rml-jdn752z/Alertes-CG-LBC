name: Alerte Cartes Graphiques LBC

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: playwright install --with-deps chromium
      - run: python botcglbc.py
        env:
          LBC_CG_BOT_TOKEN: ${{ secrets.LBC_CG_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_lbc_cg.json
          git commit -m "maj" || exit 0
          git push
